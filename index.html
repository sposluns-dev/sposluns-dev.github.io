tion_en": "2017 SCC 62", "name_en": "British Columbia Human Rights Tribunal v. Schrenk", "document_date_en": "2017-12-15T00:00:00.000Z", "url_en": "https://decisions.scc-csc.ca/scc-csc/scc-csc/en/item/16919/index.do", "province": "British Columbia"}, {"citation_en": "2017 SCC 63", "name_en": "Deloitte & Touche v. Livent Inc. (Receiver of)", "document_date_en": "2017-12-20T00:00:00.000Z", "url_en": "https://decisions.scc-csc.ca/scc-csc/scc-csc/en/item/16920/index.do", "province": "Ontario"}, {"citation_en": "2017 SCC 64", "name_en": "R. v. Boutilier", "document_date_en": "2017-12-21T00:00:00.000Z", "url_en": "https://decisions.scc-csc.ca/scc-csc/scc-csc/en/item/16921/index.do", "province": "British Columbia"}];

  // TopoJSON fetched from GitHub Pages URL (works once pushed, and locally via http.server)
  let topo = null;
  try { topo = await fetch("https://sposluns-dev.github.io/plots/canadaprovtopo.json").then(r => r.json()); } catch(e) { console.warn("TopoJSON fetch failed — map unavailable", e); };

  const provinces = topojson.feature(topo, topo.objects.canadaprov);
  const provincemesh = topojson.mesh(topo, topo.objects.canadaprov);

  // Province case counts
  const counts = d3.rollup(cases.filter(d => d.province), v => v.length, d => d.province);
  const provinceData = Array.from(counts, ([province, count]) => ({ province, count }))
    .sort((a, b) => b.count - a.count);

  // Attach count to each feature for the map
  provinces.features.forEach(f => {
    const name = f.properties.name;
    f.properties.count = counts.get(name) ?? 0;
  });

  // Centroid lookup for bubble positions
  const path = d3.geoPath(d3.geoEquirectangular().fitSize([paneW(), paneH()], provinces));
  const centroids = provinces.features.map(f => ({
    province: f.properties.name,
    count: f.properties.count,
    centroid: path.centroid(f)
  })).filter(d => d.count > 0 && !isNaN(d.centroid[0]));

  // Timeline data — cases per month
  const monthly = d3.rollup(
    cases,
    v => v.length,
    d => d.document_date_en.slice(0, 7)
  );
  const timelineData = Array.from(monthly, ([month, count]) => ({
    date: new Date(month + "-01"),
    count
  })).sort((a, b) => a.date - b.date);

  // Populate table
  const tbody = document.getElementById("tableBody");
  [...cases].sort((a, b) => a.citation_en.localeCompare(b.citation_en, undefined, { numeric: true }))
    .forEach(d => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${d.citation_en}</td>
        <td><a href="${d.url_en}" target="_blank">${d.name_en}</a></td>
        <td>${d.document_date_en.slice(0, 10)}</td>
        <td>${d.province ?? "—"}</td>`;
      tbody.appendChild(tr);
    });

  // ── Views ─────────────────────────────────────────────────────────
  function renderMap() {
    const w = paneW(), h = paneH();
    const proj = d3.geoEquirectangular().fitSize([w, h], provinces);
    const p = d3.geoPath(proj);
    const maxR = 40;
    const rScale = d3.scaleSqrt().domain([0, d3.max(provinceData, d => d.count)]).range([0, maxR]);

    const dots = provinces.features.map(f => {
      const c = p.centroid(f);
      return { province: f.properties.name, count: f.properties.count, x: c[0], y: c[1] };
    }).filter(d => d.count > 0 && !isNaN(d.x));

    return Plot.plot({
      width: w, height: h,
      projection: { type: "equirectangular", domain: provinces },
      marks: [
        Plot.geo(provinces.features, { fill: "#bbb", stroke: "white", strokeWidth: 0.8 }),
        Plot.geo(provincemesh, { stroke: "#999", strokeWidth: 0.4 }),
        Plot.dot(dots, {
          x: d => d.x, y: d => d.y,
          r: d => rScale(d.count),
          fill: "#c00", fillOpacity: 0.75,
          stroke: "white", strokeWidth: 1,
          tip: true,
          title: d => `${d.province}\n${d.count} case${d.count !== 1 ? "s" : ""}`
        })
      ]
    });
  }

  function renderBar() {
    return Plot.plot({
      width: paneW(), height: paneH(),
      marginLeft: 160,
      x: { label: "Number of Cases" },
      y: { label: null },
      marks: [
        Plot.barX(provinceData, {
          x: "count", y: "province",
          fill: "#c00", sort: { y: "x", order: "descending" }
        }),
        Plot.text(provinceData, {
          x: "count", y: "province",
          text: d => d.count, dx: 6, fill: "#222", fontSize: 12
        }),
        Plot.ruleX([0])
      ]
    });
  }

  function renderPie() {
    return Plot.plot({
      width: Math.min(paneW(), paneH()),
      height: Math.min(paneW(), paneH()),
      marks: [
        Plot.arc(provinceData, {
          theta: "count", fill: "province",
          tip: true, title: d => `${d.province}: ${d.count}`
        })
      ]
    });
  }

  function renderTimeline() {
    return Plot.plot({
      width: paneW(), height: paneH(),
      x: { type: "utc", label: "Month" },
      y: { label: "Cases" },
      marks: [
        Plot.barY(timelineData, { x: "date", y: "count", fill: "#c00", tip: true }),
        Plot.ruleY([0])
      ]
    });
  }

  // ── View switcher ─────────────────────────────────────────────────
  window.showView = function(view) {
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    event.target.classList.add("active");
    pane.innerHTML = "";
    const chart = view === "map" ? renderMap()
      : view === "bar" ? renderBar()
      : view === "pie" ? renderPie()
      : renderTimeline();
    pane.appendChild(chart);
  };

  // Initial render
  pane.appendChild(renderMap());
</script>
</body>
</html>
